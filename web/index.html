<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectFCG</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f5f7; }
    @media (prefers-color-scheme: dark) { html, body { background: #1e1f22; color: #ddd; } }
    canvas#projectfcg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               font: 15px system-ui, sans-serif; color: #666; }
  </style>
</head>
<body>
  <canvas id="projectfcg"></canvas>
  <div id="loading"><p>Loading ProjectFCG…</p></div>
  <script type="module">
    import init from './projectfcg.js';
    init().catch((e) => {
      document.getElementById('loading').innerHTML =
        '<p>ProjectFCG couldn’t start.</p><p style="font-size:13px">' + String(e) + '</p>';
    });
  </script>
</body>
</html>
