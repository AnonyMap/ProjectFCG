[package]
name = "projectfcg"
version = "0.15.1"
edition = "2021"
description = "Gantt-chart project scheduler modelled on Microsoft Project's scheduling engine"
license = "MIT"

[lib]
name = "projectfcg"
path = "src/lib.rs"

[[bin]]
name = "projectfcg"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
roxmltree = "0.20"
png = "0.18"
miniz_oxide = "0.8"
# std::time::Instant on the desktop; the browser's clock in the web build
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

# The web build (see web/README.md): WebGL, the browser's clock and files.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Location", "console"] }

# The Windows .exe icon (build.rs); not used on other platforms.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

# `cargo build --profile profiling --example profile` for callgrind/perf
[profile.profiling]
inherits = "release"
debug = true
strip = false
