# Builds ProjectFCG for Linux (.AppImage), Windows (.exe), macOS (.dmg) and
# the browser (one .html file that runs from disk) whenever a release is
# published on GitHub, and attaches the files to it.
#
#   1. Bump `version` in Cargo.toml and push.
#   2. GitHub ▸ Releases ▸ Draft a new release ▸ tag e.g. v0.7.0 ▸ Publish.
#   3. A few minutes later the four downloads appear on the release.
#
# To rebuild an existing release (say a build failed): Actions ▸ Release
# builds ▸ Run workflow, give the tag, and pick the platform to rebuild
# (or all). "Upload" = no builds and tests without touching the release.

name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and upload to (e.g. v0.7.0)
        required: true
      only:
        description: Which build to run
        type: choice
        options: [all, linux, windows, macos, web]
        default: all
      upload:
        description: Upload to the release (no = build and test only)
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: write # upload files to the release

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Version check
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$TAG" ] && [ "$v" != "$TAG" ]; then
            echo "::warning::Release tag $TAG doesn't match Cargo.toml version $v (the app will report $v)."
          fi
      - name: Run the tests
        run: cargo test --release --locked

  linux:
    name: Linux AppImage
    needs: test
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'linux'
    # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        # zsync: the .zsync file Gear Lever reads to tell whether there's an update
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev zsync
      - name: AppImage tools
        run: |
          mkdir -p ../tools
          curl -fsSL -o ../tools/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o ../tools/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x ../tools/appimagetool
      - name: Build the AppImage
        # through bash: files uploaded in GitHub's web page lose their
        # executable bit, so the script may not be runnable on its own
        env:
          # where Gear Lever looks for updates: the latest release's
          # .zsync, whose SHA-1 it compares with the installed AppImage
          UPDATE_INFO: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|ProjectFCG-*-linux-x86_64.AppImage.zsync
        run: bash packaging/build-appimage.sh
      - name: Smoke test
        run: |
          ./dist/ProjectFCG-x86_64.AppImage --appimage-extract-and-run --self-test
          # the update information Gear Lever reads
          readelf -p .upd_info dist/ProjectFCG-x86_64.AppImage | grep -q 'gh-releases-zsync|' || { echo "::error::no update information in the AppImage"; exit 1; }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="ProjectFCG-${TAG}-linux-x86_64.AppImage"
          cp dist/ProjectFCG-x86_64.AppImage "$out"
          # made after renaming, so the file it points to is the release asset
          zsyncmake -u "$out" -o "$out.zsync" "$out"
          if [ "${{ inputs.upload }}" != "no" ]; then gh release upload "$TAG" "$out" "$out.zsync" --clobber; fi

  windows:
    name: Windows exe
    needs: test
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        shell: bash
        run: ./target/release/projectfcg.exe --self-test
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="ProjectFCG-${TAG}-windows-x86_64.exe"
          cp target/release/projectfcg.exe "$out"
          if [ "${{ inputs.upload }}" != "no" ]; then gh release upload "$TAG" "$out" --clobber; fi

  macos:
    name: macOS dmg
    needs: test
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'macos'
    # macos-14 machines were retired in Nov 2026 (jobs on them were
    # cancelled before starting)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Make the app bundle
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app=dmg/ProjectFCG.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # one universal binary for both kinds of Mac
          lipo -create -output "$app/Contents/MacOS/ProjectFCG" \
            target/aarch64-apple-darwin/release/projectfcg \
            target/x86_64-apple-darwin/release/projectfcg
          cp packaging/projectfcg.icns "$app/Contents/Resources/"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # ad-hoc signature: required for Apple Silicon to run it at all
          # (not a Developer ID, so Gatekeeper still asks on first launch)
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
      - name: Smoke test
        run: ./dmg/ProjectFCG.app/Contents/MacOS/ProjectFCG --self-test
      - name: Make the disk image
        run: hdiutil create -volname ProjectFCG -srcfolder dmg -ov -format UDZO "ProjectFCG-${TAG}-macos-universal.dmg"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        if: inputs.upload != 'no'
        run: gh release upload "$TAG" "ProjectFCG-${TAG}-macos-universal.dmg" --clobber

  web:
    name: Web (one HTML file)
    needs: test
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'web'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target wasm32-unknown-unknown --bin projectfcg
      - name: wasm-bindgen (the version Cargo.lock uses)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          if curl -sSLf "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" -o wb.tgz && tar xzf wb.tgz; then
            sudo mv "wasm-bindgen-$v-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          else
            cargo install --locked wasm-bindgen-cli --version "$v"
          fi
      - name: Package and upload
        run: |
          mkdir -p build
          wasm-bindgen --target no-modules --no-typescript --out-dir build --out-name projectfcg target/wasm32-unknown-unknown/release/projectfcg.wasm
          python3 web/bundle.py build
          out="ProjectFCG-${TAG}-web.html"
          cp build/ProjectFCG.html "$out"
          if [ "${{ inputs.upload }}" != "no" ]; then gh release upload "$TAG" "$out" --clobber; fi
